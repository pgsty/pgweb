# 阅读入口、封面与显示顺序统一在这里维护。
books:
- id: int18
  title: PostgreSQL 18 内参
  summary: MVCC、WAL 与内核原理
  author: Egor Rogov 著 · 冯若航译
  version: PostgreSQL Internals · 2026 年版
  description: 从多版本并发控制、缓冲区与 WAL，到锁、查询执行和索引访问方法，系统理解 PostgreSQL 18 的内部机制。
  tone: teal
  url: https://int18.pgsql.cc/zh18/
  image: https://int18.pgsql.cc/images/internal/ru/cover.webp
  image_alt: PostgreSQL 18 内参原版封面
- id: pgint
  title: PostgreSQL 技术内幕
  summary: 存储、查询与事务机制
  author: Hironobu Suzuki 著 · 冯若航、刘阳明、张文升译
  version: 2019 年中文版 · 主体基于 PostgreSQL 9.x–11
  description: 从数据库集簇、进程和查询处理出发，逐步理解并发控制、VACUUM、缓冲区、WAL、备份与高可用。
  tone: blue
  url: https://pgint.vonng.com/
  image: https://pgint.vonng.com/cover.svg
  image_alt: PostgreSQL 技术内幕封面
- id: int14
  title: PostgreSQL 14 内参
  summary: 深入理解 PG 14 内核
  author: Egor Rogov 著 · 熊灿灿译
  version: 2024 年中文版 · PostgreSQL 14
  description: 从存储页、MVCC 与事务隔离，到缓冲区、WAL、锁、查询执行和索引，深入理解 PostgreSQL 14 的内部机制。
  tone: teal
  url: https://postgres-internals.cn/docs/
  image: https://postgres-internals.cn/book-library/images/internals-14.png
  image_alt: PostgreSQL 14 Internals 原版封面
- id: howto
  title: PostgreSQL How To
  summary: 运维、调优与故障诊断
  author: Nikolay Samokhvalov 著 · 熊灿灿译
  version: 2023 年起 · PostgreSQL 工程实践
  description: 围绕查询优化、锁等待、索引、WAL、清理与复制，按真实问题查找 PostgreSQL 运维和故障诊断的实践方法。
  tone: blue
  url: https://postgres-howto.cn/
  image: /media/img/tutorials/howto.svg
  image_alt: PostgreSQL How To 中文实践指南封面
- id: pgmon
  title: PostgreSQL 监控
  summary: 统计指标与性能观测
  author: Alexey Lesovsky 著 · 冯若航译
  version: 2024 年出版 · 示例环境 PostgreSQL 15
  description: 从活动统计、查询和 I/O 到 WAL、复制与清理，建立定位 PostgreSQL 性能问题的观察方法。
  tone: green
  url: https://pgmon.pgsql.cc/
  image: https://pgmon.pgsql.cc/images/monitoring/cover.jpg
  image_alt: PostgreSQL 监控封面
- id: pgqpt
  title: PostgreSQL 18 查询优化
  summary: 执行计划与查询调优
  author: Pavel Tolmachev 著 · 冯若航译
  version: 2026 年出版 · PostgreSQL 18
  description: 从演示数据库走到访问方法、排序、连接、统计信息、性能剖析和实用的查询调优方法。
  tone: amber
  url: https://pgqpt.pgsql.cc/
  image: https://pgqpt.pgsql.cc/images/qpt/cover.webp
  image_alt: PG18 查询优化封面
- id: intro
  title: PG 入门
  summary: 从 SQL 开始认识数据库
  author: Pavel Luzanov、Egor Rogov、Igor Levshin 著 · 冯若航译
  version: 第 11 版 · PostgreSQL 17
  description: 从安装服务器、编写 SQL 到连接应用，一步步认识 PostgreSQL，并找到下一阶段的学习方向。
  tone: blue
  url: https://intro.pgsql.cc/
  image: https://intro.pgsql.cc/images/intro/cover.webp
  image_alt: PG 入门封面
- id: pgexp
  title: PostgreSQL 实例教程
  summary: 57 节循序渐进的实践课
  author: Dariush Abbasi 著 · Codex 译
  version: PostgreSQL 17 · 57 节短课
  description: 从第一次查询开始，逐步学习数据建模、查询、索引、事务、存储逻辑、全文检索和日常运维。
  tone: slate
  url: https://pgexp.pgsql.cc/
  image: https://pgexp.pgsql.cc/images/examples/cover.svg
  image_alt: PostgreSQL 实例教程封面
- id: basic
  title: PostgreSQL 基础
  summary: 从 8 KB 页到生产运维
  description: 从磁盘上的 8 KB 页讲到索引、查询计划、锁、迁移和生产运维。
  tone: slate
  url: https://basic.pgsql.cc/
  image: /media/img/tutorials/basics.svg
  image_alt: PostgreSQL 基础：Eight Kilobytes 封面
  author: Chase Pierce 著 · 冯若航译
  version: Eight Kilobytes · PostgreSQL 18
- id: feat
  title: PG 特性介绍
  summary: PG 9.5–19 大版本演进
  description: 逐个版本了解 PostgreSQL 的新特性、SQL 示例与兼容性变化。
  tone: blue
  url: https://feat.pgsql.cc/
  image: /media/img/tutorials/features-cover.webp
  image_alt: PG 特性介绍封面：PostgreSQL 9.5–19 大版本演进
  author: Noriyoshi Shinoda 著 · 冯若航译
  version: PostgreSQL 9.5–19 · 十二个版本
- id: pg36g
  title: PG 三十六计
  summary: 开发、运维与工程实践
  author: 冯若航（Vonng）
  version: PostgreSQL 18.6 · Pigsty 4.5
  description: 从 SQL、应用开发一路讲到部署、监控、故障恢复与事故复盘，把 PostgreSQL 的知识组织成一条可以动手验证的工程路径。
  tone: navy
  url: https://pg36g.vonng.com/
  image: https://pg36g.vonng.com/logo.png
  image_alt: PG 三十六计封面
- id: ddia
  title: 设计数据密集型应用 (2nd)
  summary: 数据系统与分布式架构
  author: Martin Kleppmann、Chris Riccomini 著 · 冯若航译
  version: 第一版/第二版，简体中文与繁体中文
  description: 从数据模型、存储引擎与事务出发，理解复制、分片、一致性、批处理和流处理背后的设计权衡。
  tone: plum
  url: https://ddia.vonng.com/
  image: https://ddia.vonng.com/title.jpg
  image_alt: 设计数据密集型应用第二版封面
