    url: https://pgpro.pgsql.cc/dbs/
  - code: DEV1
    title: PostgreSQL 后端开发：基础课程
    description: SQL、PL/pgSQL、函数、过程和触发器。
    url: https://pgpro.pgsql.cc/dev1/
  - code: DEV2
    title: PostgreSQL 后端开发：高级课程
    description: 扩展、操作符类、全文搜索和 FDW。
    url: https://pgpro.pgsql.cc/dev2/
  - code: PGPRO
    title: Postgres Pro Enterprise 功能
    description: 企业版特有的性能、安全、备份与高可用能力。
