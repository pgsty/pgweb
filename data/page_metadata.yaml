pages:
  /about/:
    title: PostgreSQL 项目简介与核心特性
    description: 了解 PostgreSQL 的对象关系型数据库特性、可靠性、性能、扩展能力与社区资源。
    lang: zh
  /about/casestudies/mohawk/:
    title: 'PostgreSQL: Case Studies: Mohawk Software'
    description: Mohawk Software provides consulting services to many types of companies seeking to deploy
      complex knowledge management and data mining systems. They provide solutions that match the power
      and sophistication of larger systems deployed at For…
    lang: en
  /about/casestudies/shannonmedical/:
    title: 'PostgreSQL: Case Studies: Shannon Medical Center'
    description: Shannon Medical Center performs data analysis for financial, operational, and clinical
      care systems of hospitals and health care institutions.
    lang: en
  /about/casestudies/vanten/:
    title: 'PostgreSQL: Case Studies: Vanten Inc.'
    description: Vanten Inc. develops Open Source technology solutions for the Japanese marketplace. They
      have extensive experience in the development and implementation of solutions for many types of enterprises,
      with the goal of providing cost-effective s…
    lang: en
  /about/contact/:
    title: PostgreSQL 联系我们
    description: 汇总 PostgreSQL 的 Bug、安全问题、技术支持、媒体与社区联系渠道，并说明如何反馈 pgsql.cc 的译文和网站问题。
    lang: zh
  /about/donate/:
    title: PostgreSQL 捐赠与非营利组织
    description: 了解支持 PostgreSQL 项目的认可非营利组织，以及向这些组织捐赠的方式。
    lang: zh
  /about/donate_pg_org/:
    title: PostgreSQL 捐赠
    description: PostgreSQL 的捐赠由资金小组管理。捐赠的资金可用于 PostgreSQL 社区所需的各种服务，包括推广材料、项目基础设施、法律费用等
    lang: zh
  /about/governance/:
    title: PostgreSQL 治理
    description: 了解 PostgreSQL 的项目治理结构，查阅核心团队、各委员会与工作小组的职责、成员和章程。
    lang: zh
  /about/governance/contributors/:
    title: PostgreSQL 贡献者委员会
    description: 了解 PostgreSQL 贡献者委员会的职责、成员与工作方式，以及贡献者认可政策和联系渠道。
    lang: zh
  /about/governance/sysadmin/:
    title: PostgreSQL 基础设施团队
    description: 了解 PostgreSQL 基础设施团队负责的服务、工作方式与联系渠道，以及网站开发和基础设施管理的分工。
    lang: zh
  /about/licence/:
    title: PostgreSQL 许可证
    description: PostgreSQL 采用 PostgreSQL 许可证发布，这是一种宽松的开源许可证，类似于 BSD 或 MIT 许可证
    lang: zh
  /about/policies/:
    title: PostgreSQL 项目政策
    description: 浏览 PostgreSQL 项目的正式政策，包括行为准则、隐私、商标、版本、服务与社区认可政策。
    lang: zh
  /about/policies/archives/:
    title: PostgreSQL 邮件列表归档政策
    description: 了解 PostgreSQL 邮件列表的归档原则、准确记录要求及隐私相关说明。
    lang: zh
  /about/policies/coc-translations/:
    title: PostgreSQL 行为准则翻译与审批流程
    description: PostgreSQL 行为准则委员会负责管理将行为准则从英语翻译成其他语言的审批流程，以及在政策修订时更新翻译
    lang: zh
  /about/policies/coc/:
    title: PostgreSQL 行为准则
    description: 阅读 PostgreSQL 社区行为准则，了解参与项目时应遵循的专业、礼貌与包容原则。
    lang: zh
