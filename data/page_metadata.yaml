    description: 联系 PostgreSQL 行为准则委员会，查看现任成员与委员会职责。
    lang: zh
  /about/policies/conferences/:
    title: PostgreSQL 社区会议认可政策
    description: 社区会议认可计划是一项自愿方案，向 PostgreSQL 网站活动列表提交活动的提交者可以根据以下标准进行自我评估，如果符合要求，可以将其活动宣传为 PostgreSQL
      社区活动
    lang: zh
  /about/policies/contributors/:
    title: PostgreSQL 认可贡献者政策
    description: PostgreSQL 贡献者简介页面列出了对 PostgreSQL 项目做出了长期投入时间和精力的实质性贡献的人员。一次性或短期的贡献通常不被视为足以列入，除非涉及相当大量的代码和时间
    lang: zh
  /about/policies/funds-group/:
    title: PostgreSQL 资金小组
    description: PostgreSQL 项目与 Software in the Public Interest, Inc. 之间关系的治理章程
    lang: zh
  /about/policies/news-and-events/:
    title: PostgreSQL 新闻与活动审批政策
    description: 查阅 PostgreSQL 新闻与活动的收录政策，了解提交要求、审核标准、发布频率及活动公告规则。
    lang: zh
  /about/policies/npos/:
    title: 认可的 PostgreSQL 非营利组织
    description: 认可的 PostgreSQL 非营利组织（NPO）将作为认可组织列于 PostgreSQL 网站上。要获得 NPO 认可，组织必须自我认证其满足以下标准，这些标准旨在确保其符合
      PostgreSQL 社区所期望的开放性标准
    lang: zh
  /about/policies/planet-postgresql/:
    title: Planet PostgreSQL 博客收录政策
    description: Planet PostgreSQL 是由 PostgreSQL 社区运营的博客聚合服务。除了 Planet 主站之外，文章也会被发布（“聚合”）到 www.postgresql.org
      网站上
    lang: zh
  /about/policies/privacy/:
    title: PostgreSQL 隐私政策
    description: PostgreSQL 网站隐私政策说明访问日志、个人信息处理和相关权利。
    lang: zh
  /about/policies/project-name/:
    title: PostgreSQL 项目名称政策
    description: 了解 PostgreSQL 的正式项目名称、Postgres 简称的由来与使用惯例，以及社区对项目名称的说明。
    lang: zh
  /about/policies/services-and-hosting/:
    title: PostgreSQL 专业服务与托管审批政策
    description: 查阅 PostgreSQL 专业服务与托管服务的收录政策，了解企业资料、服务描述、覆盖地区和审核要求。
    lang: zh
  /about/policies/sponsorship/:
    title: PostgreSQL 赞助政策
    description: PostgreSQL 赞助政策说明赞助商级别、资格与支持社区工作的方式。
    lang: zh
  /about/policies/trademarks/:
    title: PostgreSQL 商标政策
    description: 本政策涉及我们的商标。具体而言，Postgres 和 PostgreSQL 以及大象标志（Slonik）均为 PostgreSQL 加拿大社区协会的注册商标。如果您希望使用这些标志，必须遵守本政策
    lang: zh
  /about/policies/twitter/:
    title: PostgreSQL @postgresql Twitter 账户政策
    description: PostgreSQL @postgresql Twitter 账户人工运营与内容发布政策。
    lang: zh
  /about/policies/user-groups/:
    title: 认可的 PostgreSQL 用户组
    description: 认可的 PostgreSQL 用户组，又称"PUG"，可以作为 PostgreSQL 网站上的认可用户组列出。要成为认可的 PostgreSQL 用户组，用户组必须自我证明其满足以下标准，这些标准旨在确保其达到 PostgreSQL 社区期望的开放性要求
    lang: zh
  /about/press/:
    title: PostgreSQL 媒体资料与新闻资料包
    description: 获取 PostgreSQL 新闻资料包、媒体常见问题和公关团队联系方式，查阅各版本发布资料及不同语言版本。
    lang: zh
  /about/press/faq/:
    title: PostgreSQL 媒体常见问题
    description: 面向媒体介绍 PostgreSQL 的版本发布、许可证、项目治理、用户与社区支持，并解答常见的数据库选型问题。
    lang: zh
