  /about/policies/coc/he/:
    title: 'PostgreSQL: קוד התנהגות (תרגום לעברית)'
    description: פרויקט PostgreSQL מתגאה באיכות הקוד והעבודה שלנו, ובהישגים הטכניים והמקצועיים של הקהילה
      שלנו. אנו מצפים מכל המשתתפים להתנהל בצורה מקצועית, לפעול בנימוס בסיסי ולמען האינטרסים המשותפים של
      כולנו, עם כבוד הדדי לכל המשתתפים והמפתחים שלנו.
