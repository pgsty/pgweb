    description: 我々PostgreSQLプロジェクトは、コードや取り組み、コミュニティにおける技術的なプロフェッショナルとしての業績に誇りを持っています。我々は皆様がプロとして行動する中で、礼儀と共通の利益を重んじ、全てのユーザーと開発者に敬意を払うことを望んでいます
